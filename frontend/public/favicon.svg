<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Dorsal de carrera">
  <rect width="32" height="32" rx="7" fill="#0f1214" />
  <!-- the bib: the only light surface in the product, at favicon scale -->
  <rect x="5" y="7.5" width="22" height="17" rx="2.5" fill="#f6f7f8" />
  <!-- the two holes a safety pin goes through -->
  <circle cx="8.5" cy="11" r="1.2" fill="#0f1214" opacity="0.32" />
  <circle cx="23.5" cy="11" r="1.2" fill="#0f1214" opacity="0.32" />
  <!-- the number, reduced to the bars that survive at 16px -->
  <rect x="9" y="14.5" width="14" height="3" rx="1.1" fill="#0f1214" />
  <!-- the torn perforated edge -->
  <g fill="#0f1214" opacity="0.4">
    <rect x="7" y="21" width="2.6" height="1.3" rx="0.65" />
    <rect x="11.1" y="21" width="2.6" height="1.3" rx="0.65" />
    <rect x="15.2" y="21" width="2.6" height="1.3" rx="0.65" />
    <rect x="19.3" y="21" width="2.6" height="1.3" rx="0.65" />
  </g>
</svg>
