# Local development stack.
#
# Postgres mirrors production. MinIO is here so the S3 code path -- the exact
# same adapter that talks to Cloudflare R2 in production -- gets exercised
# locally, long before it touches a real bucket.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rpf
      POSTGRES_PASSWORD: rpf
      POSTGRES_DB: rpf
    ports:
      # 5433 on the host: a locally installed Postgres usually owns 5432 and
      # would silently shadow this container.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpf"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the two buckets once and exits. This mirrors production exactly:
  # on R2, public access is granted per bucket (a custom domain exposes the
  # whole bucket), so originals must live in a bucket of their own that is
  # only ever reachable through a signed URL.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/race-photos-private &&
      mc mb --ignore-existing local/race-photos-public &&
      mc anonymous set download local/race-photos-public &&
      mc anonymous set none local/race-photos-private &&
      echo 'buckets ready: private (originals), public (thumbs + previews)'
      "

volumes:
  postgres_data:
  minio_data:
